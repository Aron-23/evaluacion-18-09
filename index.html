<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="focus-mode">
    <div class="glass-container">
        <div class="timer-display">
            <svg class="progress-ring" width="300" height="300">
                <circle class="progress-ring__circle-bg" stroke="rgba(255, 255, 255, 0.1)" stroke-width="8" fill="transparent" r="140" cx="150" cy="150"/>
                <circle class="progress-ring__circle" stroke="white" stroke-width="8" fill="transparent" r="140" cx="150" cy="150"/>
            </svg>
            <div id="timer-text" class="timer-text">25:00</div>
        </div>
        
        <h1 id="status-text">Enfoque</h1>
        
        <div class="controls">
            <button id="start-btn" class="btn primary">Iniciar</button>
            <button id="reset-btn" class="btn secondary">Reiniciar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
